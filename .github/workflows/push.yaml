name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - master
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: read
jobs:
  check-format:
    name: Format 🔍
    if: github.ref_name == 'master'
    uses: $/.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build 🧱
    uses: $/.github/workflows/build-project.yaml
    permissions:
      contents: read

  compatibility-validation:
    name: Validate Compatibility 🕵️
    if: github.ref_name == 'master'
    runs-on: ubuntu-26.04
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Changed Files ✅
        uses: $/.github/actions/check-changes
        id: checks
        with:
          baseRef: ${{ github.event.before }}
          checkGlob: plugins/win-capture/data/*.json

      - name: Check for Invalid Compatibility Data 📉
        if: fromJSON(steps.checks.outputs.hasChangedFiles)
        uses: $/.github/actions/compatibility-validator
        with:
          repositorySecret: ${{ github.token }}

  services-validation:
    name: Validate Services 🕵️
    if: github.ref_name == 'master'
    runs-on: ubuntu-26.04
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Changed Files ✅
        uses: $/.github/actions/check-changes
        id: checks
        with:
          baseRef: ${{ github.event.before }}
          checkGlob: plugins/rtmp-services/data/*.json

      - name: Check Services JSON Schema 📉
        if: fromJSON(steps.checks.outputs.hasChangedFiles)
        uses: $/.github/actions/services-validator
        with:
          repositorySecret: ${{ github.token }}
          runSchemaChecks: true
          runServiceChecks: false

  update-documentation:
    name: Update Documentation 📖
    if: github.repository_owner == 'based-software' && (github.ref_name == 'master' || github.ref_type == 'tag')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Changed Files ✅
        if: github.ref_type != 'tag'
        uses: $/.github/actions/check-changes
        id: checks
        with:
          baseRef: ${{ github.event.before }}
          checkGlob: '!(cmake*)'

      - uses: $/.github/actions/generate-docs
        if: github.ref_type == 'tag' || fromJSON(steps.checks.outputs.hasChangedFiles)
        with:
          disableLinkExtensions: ${{ github.ref_type == 'tag' }}


  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    needs: build-project
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) | +([0-9]).+([0-9]).+([0-9])-based+([0-9.]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: fromJSON(steps.check.outputs.validTag)
        with:
          merge-multiple: true
          path: ${{ github.workspace }}/artifacts

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          cd ${{ github.workspace }}/artifacts
          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          echo '```' >> ${{ github.workspace }}/CHECKSUMS.txt
          for file in *; do
            [[ -f "${file}" ]] || continue
            echo "${file}: $(sha256sum "${file}" | cut -d ' ' -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done
          echo '```' >> ${{ github.workspace }}/CHECKSUMS.txt

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          : Create Release 🛫
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          prerelease_flag=''
          if [[ "${PRERELEASE}" == 'true' ]]; then
            prerelease_flag='--prerelease'
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --draft ${prerelease_flag} \
            --title "obs ${GITHUB_REF_NAME}" \
            --notes-file "${GITHUB_WORKSPACE}/CHECKSUMS.txt" \
            ${{ github.workspace }}/artifacts/*
