name: Build Project
on:
  workflow_call:
jobs:
  check-event:
    name: Event Data 🔎
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              config_data=('codesign:true' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

  ubuntu-build:
    name: Ubuntu 🐧
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Build OBS Studio 🧱
        uses: $/.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package OBS Studio 📀
        uses: $/.github/actions/package-obs
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*-sources.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*.deb

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*.ddeb

      - name: Create AppImage 📦
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        env:
          COMMIT_HASH: ${{ needs.check-event.outputs.commitHash }}
        run: |
          : Create AppImage 📦
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          : Fetch linuxdeploy and Qt plugin 🛍️
          sudo apt-get update -qq
          sudo apt-get install -y -qq libqt6svg6 qt6-svg-plugins
          curl -fSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export PATH="${GITHUB_WORKSPACE}:${PATH}"

          : Stage AppDir from packaged deb 📂
          deb_file=$(find "${GITHUB_WORKSPACE}/build_ubuntu" -maxdepth 1 -name 'obs-studio-*.deb' | head -1)
          if [[ -z ${deb_file} ]]; then
            echo "::error::No ubuntu deb artifact found in build_ubuntu"
            exit 1
          fi
          mkdir -p AppDir
          dpkg-deb -x "${deb_file}" AppDir
          find AppDir -maxdepth 3 -type d | sort | head -20

          : Locate desktop file, icon, executable, and qmake 🔎
          desktop_file=$(find AppDir -name '*.desktop' | head -1)
          icon_file=$(find AppDir -name 'com.obsproject.Studio.png' | sort -r | head -1)
          obs_bin=$(find AppDir -type f -name 'obs' -path '*/bin/*' | head -1)
          export QMAKE="$(command -v qmake6 || command -v qmake || find /usr/lib/qt6/bin -name qmake 2>/dev/null | head -1)"
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/AppDir/usr/local/lib:${GITHUB_WORKSPACE}/AppDir/usr/local/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH}"

          if [[ -z ${desktop_file} || -z ${icon_file} || -z ${obs_bin} ]]; then
            echo "::error::AppDir missing desktop file, icon, or obs binary"
            find AppDir -type f | head -50
            exit 1
          fi

          : Write custom AppRun so obs finds usr/local data paths 📝
          cat > obs-apprun <<'APPRUN'
          #!/bin/sh
          APPDIR="$(dirname "$(readlink -f "${0}")")"
          export OBS_DATA_PATH="${APPDIR}/usr/local/share/obs/obs-studio/"
          export OBS_LEGACY_PLUGINS_PATH="${APPDIR}/usr/local/lib/x86_64-linux-gnu/obs-modules/core"
          export OBS_LEGACY_PLUGINS_DATA_PATH="${APPDIR}/usr/local/share/obs/obs-modules/core"
          export QT_PLUGIN_PATH="${APPDIR}/usr/plugins"
          export LD_LIBRARY_PATH="${APPDIR}/usr/lib:${APPDIR}/usr/local/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          exec "${APPDIR}/usr/local/bin/obs" "$@"
          APPRUN
          chmod +x obs-apprun

          : Bundle dependencies and produce AppImage 🗜️
          : Deploy dependencies of runtime-dlopened modules as well 🔗
          deploy_args=()
          while IFS= read -r module_file; do
            deploy_args+=(--library "${module_file}")
          done < <(find AppDir -type f -name '*.so')

          ./linuxdeploy --appimage-extract-and-run \
            --appdir AppDir \
            --executable "${obs_bin}" \
            --desktop-file "${desktop_file}" \
            --icon-file "${icon_file}" \
            --custom-apprun obs-apprun \
            --plugin qt \
            --output appimage \
            "${deploy_args[@]}"

          mv ./*.AppImage "${GITHUB_WORKSPACE}/build_ubuntu/obs-studio-${COMMIT_HASH}-x86_64.AppImage"

      - name: Upload AppImage Artifact 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-appimage
          path: ${{ github.workspace }}/build_ubuntu/obs-studio-*.AppImage

      - uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  windows-build:
    name: Windows 🪟
    strategy:
      matrix:
        architecture: [x64]
    runs-on: windows-2025-vs2026
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Build OBS Studio 🧱
        uses: $/.github/actions/build-obs
        env:
          TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_HASH: ${{ secrets.TWITCH_HASH }}
          RESTREAM_CLIENTID: ${{ secrets.RESTREAM_CLIENTID }}
          RESTREAM_HASH: ${{ secrets.RESTREAM_HASH }}
          YOUTUBE_CLIENTID: ${{ secrets.YOUTUBE_CLIENTID }}
          YOUTUBE_CLIENTID_HASH: ${{ secrets.YOUTUBE_CLIENTID_HASH }}
          YOUTUBE_SECRET: ${{ secrets.YOUTUBE_SECRET }}
          YOUTUBE_SECRET_HASH: ${{ secrets.YOUTUBE_SECRET_HASH }}
          GPU_PRIORITY_VAL: ${{ secrets.GPU_PRIORITY_VAL }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}

      - name: Package OBS Studio 📀
        uses: $/.github/actions/package-obs
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          target: ${{ matrix.architecture }}
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          name: obs-studio-windows-${{ matrix.architecture }}-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/build_${{ matrix.architecture }}/obs-studio-*.zip
